services:
  backend:
    build:
      context: .

    container_name: CC_backend

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://database:5432/card_collector
      DB_USER: admin
      DB_PASSWORD: ccDB1!

      RUN_MIGRATIONS: "true"
      SEED_DATABASE: "false"

      # Bulk import options.
      # true = import all configured game data on startup.
      BULK_IMPORT_ON_STARTUP: "true"

      # false = only run each first-time bulk import once.
      # true = run the full bulk import again on every backend startup.
      FORCE_BULK_IMPORT: "false"

      IMPORT_POKEMON_BULK: "true"
      IMPORT_MAGIC_BULK: "true"

      # 0 means no limit. Use a small number like 200 while testing.
      POKEMON_BULK_MAX_CARDS: "200"
      MTG_BULK_MAX_CARDS: "200"

      # Optional delay between Pokemon detail requests.
      # 0 is fastest. Use 50 or 100 if TCGdex starts rejecting requests.
      BULK_IMPORT_REQUEST_DELAY_MS: "0"

      # Price update options.
      # This re-runs the bulk import later, so prices and card data are updated.
      AUTO_PRICE_UPDATE: "true"
      UPDATE_POKEMON_PRICES: "true"
      UPDATE_MAGIC_PRICES: "true"
      PRICE_UPDATE_INITIAL_DELAY_MINUTES: "1"
      PRICE_UPDATE_INTERVAL_MINUTES: "5"

      MANUAL_CARD_IMPORT_ENABLED: "false"
      ADMIN_IMPORT_TOKEN: "local admin token"

    depends_on:
      database:
        condition: service_healthy

    restart: on-failure

  database:
    image: postgres:16-alpine
    container_name: CC_database

    environment:
      POSTGRES_DB: card_collector
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ccDB1!

    volumes:
      - db_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d card_collector" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
