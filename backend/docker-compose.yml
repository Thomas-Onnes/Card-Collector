services:
  # Start alles met: docker compose up --build
  backend:
    build:
      context: .
    container_name: CC_backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://database:5432/card_collector}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-ccDB1!}
      RUN_MIGRATION: ${RUN_MIGRATION:-true}
      SEED_DATABASE: ${SEED_DATABASE:-true}

      IMPORT_ALL_POKEMON_SETS: ${IMPORT_ALL_POKEMON_SETS:-true}
      SELECTED_POKEMON_SETS: ${SELECTED_POKEMON_SETS:-base1,base2,base3,base4,base5}
    depends_on:
      database:
        condition: service_healthy

  database:
    # Verbinden met de database:
    # docker compose exec database psql -U admin -d card_collector
    # \l om alle databases te zien.
    # \c card_collector om de database te selecteren.
    # \dt om alle tables te zien.
    # \d users om de users tabel structuur te bekijken.
    # \q om eruit te gaan.
    image: postgres:16-alpine
    container_name: CC_database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-card_collector}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ccDB1!}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data:
